name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: ./build.sh "${GITHUB_REF_NAME#v}"
      packages: app/build/*.fwsc
      test: make test-host PY=python3 && make test-host-smk PY=python3
