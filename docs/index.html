  :root { color-scheme: light; font: 16px/1.5 Barlow, "Helvetica Neue", Arial, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf4e8; color: #48392f; }

<script>
(() => {
  const KEY = "fm1-wheel-lang";
  const q = new URLSearchParams(location.search).get("lang");
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (_) {}
  const lang = q === "pt" || q === "en" ? q
    : saved === "pt" || saved === "en" ? saved
    : ((navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""])
        .some((l) => /^pt(-|$)/i.test(l)) ? "pt" : "en");
  if (q === "pt" || q === "en") {
    try { localStorage.setItem(KEY, q); } catch (_) {}
  }
  location.replace(lang + "/");
})();
</script>
